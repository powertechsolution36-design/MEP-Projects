# /etc/nginx/sites-available/mep-projects-web
# Symlink: ln -s /etc/nginx/sites-available/mep-projects-web /etc/nginx/sites-enabled/
server {
    listen 80;
    listen [::]:80;
    server_name mep-projects.spereon.codes;
    # Uncomment after certbot: return 301 https://$host$request_uri;

    root /var/www/mep-projects/web/dist;
    index index.html;

    # SPA fallback - all routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # No cache on index/manifest
    location = /index.html { add_header Cache-Control "no-store"; }
    location = /manifest.webmanifest { add_header Cache-Control "no-store"; }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    access_log /var/log/nginx/mep-web-access.log;
    error_log /var/log/nginx/mep-web-error.log;
}
