button{cursor:pointer;font-size:13px}

.quick button b{display:block;color:var(--red);font-size:12px}

#side .uinfo{padding:12px 16px;border-top:1px solid #263548;font-size:12px}

.bell{position:relative;background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 11px;font-size:15px}
.bell i{position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:10px;font-size:10px;font-style:normal;padding:1px 5px;font-weight:700}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:16px}

var API_BASE = (function(){
  // Auto-detect: if running on the deployed domain, use the API subdomain
  var h = location.hostname;
  if (h === 'mep-projects.spereon.codes') return 'https://api.mep-projects.spereon.codes';
  if (h === 'localhost' || h === '127.0.0.1') return 'http://localhost:4001';
  // Fallback: try same origin /api or the production API
  return 'https://api.mep-projects.spereon.codes';
})();
var TOKEN = null;
var API_MODE = true; // set false to fall back to localStorage-only mode

function api(method, path, body) {
  var opts = { method: method, headers: { 'Content-Type': 'application/json' } };
  if (TOKEN) opts.headers['Authorization'] = 'Bearer ' + TOKEN;
  if (body) opts.body = JSON.stringify(body);
  return fetch(API_BASE + path, opts).then(function(r) {
    if (!r.ok) return r.json().then(function(e) { throw new Error(e.error || 'API error ' + r.status); });
    return r.json();
  });
}

var DB, U=null, VIEW="dash", PARAM=null;

function load(){
  // Initial load just sets up empty DB; real data comes after login via loadFromAPI()
  try{var s=localStorage.getItem("pt_db_v12");if(s){DB=JSON.parse(s);return}}catch(e){}
  DB=seedDB();seedProjects(DB);saveLocal();
}
function loadFromAPI(){
  return api('GET','/api/data').then(function(d){
    // Map MongoDB _id to id for compatibility with all view code
    function mapIds(arr){
      if(!arr)return[];
      return arr.map(function(x){var o=Object.assign({},x);o.id=o._id;return o});
    }
    DB.companies=mapIds(d.companies);
    DB.users=mapIds(d.users);
    DB.enquiries=mapIds(d.enquiries);
    DB.sos=mapIds(d.sos);
    DB.projects=mapIds(d.projects);
    DB.svcCalls=mapIds(d.svcCalls);
    DB.contracts=mapIds(d.contracts);
    DB.payments=mapIds(d.payments);
    DB.notifs=mapIds(d.notifs);
    DB.checklists=mapIds(d.checklists||[]);
    DB.invCats=mapIds(d.invCats||[]);
    DB.invLocs=mapIds(d.invLocs||[]);
    DB.invItems=mapIds(d.invItems||[]);
    DB.invIssues=mapIds(d.invIssues||[]);
    DB.invTxns=mapIds(d.invTxns||[]);
    // Keep templates and seq from seed for compatibility
    if(!DB.templates){var sd=seedDB();DB.templates=sd.templates}
    if(!DB.seq){DB.seq={psc:0,so:0,enq:0,proj:0,pay:0,call:0,user:0,contract:0,notif:0,company:0,chk:0,invItem:0,invCat:0,invLoc:0,invIssue:0,invTxn:0}}
    saveLocal();
  });
}

function saveLocal(){try{localStorage.setItem("pt_db_v12",JSON.stringify(DB))}catch(e){}}

function save(){
  saveLocal();
  if(!API_MODE||!TOKEN)return;
  // Debounce API sync — wait 1 second after last save() call
  clearTimeout(_syncTimer);
  _syncTimer=setTimeout(function(){
    syncToAPI();
  },1000);
}

function syncToAPI(){
  if(!TOKEN)return;
  // Send current state to server
  var payload={
    enquiries:DB.enquiries,
    sos:DB.sos,
    projects:DB.projects,
    svcCalls:DB.svcCalls,
    contracts:DB.contracts,
    payments:DB.payments,
    notifs:DB.notifs,
    checklists:DB.checklists,
    invCats:DB.invCats,
    invLocs:DB.invLocs,
    invItems:DB.invItems,
    invIssues:DB.invIssues,
    invTxns:DB.invTxns
  };
  if(U&&U.role==='super')payload.companies=DB.companies;
  api('POST','/api/data/sync',payload).catch(function(e){
    console.warn('Sync failed (data saved locally):',e.message);
  });
}

function doLogin(){
 var un=gv("lu"),pw=gv("lp");
 if(un==="dev"&&pw==="mode"){toggleDevMode();document.getElementById("lu").value="";document.getElementById("lp").value="";return}

 if(API_MODE){
  // Try API login first
  toast("Signing in...");
  api('POST','/api/auth/login',{un:un,pw:pw}).then(function(r){
    TOKEN=r.token;
    try{localStorage.setItem("pt_token",TOKEN)}catch(e){}
    var u=r.user;
    u.id=u.id||u._id;
    // Load all data from API
    return loadFromAPI().then(function(){login(u)});
  }).catch(function(err){
    // If API fails, try localStorage fallback
    console.warn('API login failed:',err.message);
    var u=DB.users.find(function(x){return x.un===un&&x.pw===pw});
    if(u){
      API_MODE=false;TOKEN=null;
      toast("Offline mode — using local data");
      login(u);
    } else {
      toast(err.message||"Invalid credentials.");
    }
  });
 } else {
  // Local-only fallback
  var u=DB.users.find(function(x){return x.un===un&&x.pw===pw});
  if(!u){toast("Invalid credentials.");return}
  var c=DB.companies.find(function(x){return x.id===u.co});
  if(u.role!=="super"&&c&&c.status==="Suspended"){toast("Company subscription suspended. Contact provider.");return}
  login(u);
 }

function collected(c){ // approx total collected since subscription start
 if(c.status!=="Active"||!c.subRate||!c.subStart)return 0;
 var days=(new Date()-new Date(c.subStart))/86400000;if(days<0)return 0;
 if(c.subCycle==="Yearly")return c.subRate*Math.max(1,Math.ceil(days/365));

}

function hit(obj,fields){
 var q=srchVal().trim().toLowerCase();
 if(!q)return true;
 var blob=fields.map(function(f){return obj[f]==null?"":String(obj[f])}).join(" ").toLowerCase();
 return q.split(/\s+/).every(function(w){return blob.indexOf(w)>=0});
}
function setFilt(k,v){FILT[k]=v;nav(VIEW)}
function clearFilt(){FILT={};nav(VIEW)}
function uniq(arr,f){var o={};arr.forEach(function(x){var v=f(x);if(v)o[v]=1});return Object.keys(o).sort()}
function selFilt(id,label,vals,cur){
 return '<div><label>'+label+'</label><select onchange="setFilt(\''+id+'\',this.value)"><option value="">All</option>'+
 vals.map(function(v){return '<option'+(cur===v?" selected":"")+'>'+esc(v)+'</option>'}).join("")+'</select></div>';
}
function applyEnqFilt(rows){
 var f=FILT;
 return rows.filter(function(x){
  if(f.q){var q=f.q.toLowerCase();
   var blob=[x.name,x.phone,x.ref,x.seg,x.siteType,x.next,x.done,x.remark,x.cap].join(" ").toLowerCase();
   if(blob.indexOf(q)<0)return false}
  if(f.seg&&x.seg!==f.seg)return false;
  if(f.siteType&&x.siteType!==f.siteType)return false;
  if(f.rating&&String(x.rating)!==f.rating)return false;
  if(f.status&&x.status!==f.status)return false;
  if(f.ref&&x.ref!==f.ref)return false;
  if(f.from&&(x.review||"")<f.from)return false;
  if(f.to&&(x.review||"")>f.to)return false;
  if(f.ndFrom&&(x.nextDate||"")<f.ndFrom)return false;
  if(f.ndTo&&(x.nextDate||"")>f.ndTo)return false;
  if(f.vmin&&(x.value||0)<Number(f.vmin))return false;
  if(f.vmax&&(x.value||0)>Number(f.vmax))return false;
  return true;});
}

/* ---- timeline / delay helpers ---- */
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/86400000)}
function projPlanned(p){return p.chk.filter(function(c){return c.plan}).length}
function timelineReady(p){return !!p.timelineSet&&projPlanned(p)>0}
function delayedItems(p){
 var t=today();
 return p.chk.filter(function(c){return !c.done&&c.plan&&c.plan<t});
}
function projTargetEnd(p){
 var d="";p.chk.forEach(function(c){if(c.plan&&c.plan>d)d=c.plan});return d;
}
function itemStatus(c){
 if(c.done){
  if(!c.plan)return{txt:"Completed "+c.date,cls:"b-grn"};
  var v=daysBetween(c.plan,c.date);
  if(v>0)return{txt:"Completed "+c.date+" · "+v+"d late",cls:"b-amb"};
  return{txt:"Completed "+c.date+(v<0?" · "+(-v)+"d early":" · on time"),cls:"b-grn"};
 }
 if(!c.plan)return{txt:"No target date",cls:"b-gry"};
 var od=daysBetween(c.plan,today());
 if(od>0)return{txt:"Overdue by "+od+" day"+(od>1?"s":""),cls:"b-red"};
 return{txt:"Scheduled "+c.plan,cls:"b-blu"};
}
function runDelayCheck(){
 if(!U||U.role==="super")return;
 var t=today();
 mine(DB.projects).forEach(function(p){
  if(p.status!=="Ongoing"||!timelineReady(p))return;
  var late=delayedItems(p);
  if(!late.length)return;
  if(p.delayNotified===t)return;           // once per day per project
  p.delayNotified=t;
  var worst=late.reduce(function(a,c){var d=daysBetween(c.plan,t);return d>a?d:a},0);
  var pmRole=p.div==="HVAC"?"hvac_pm":p.div==="Solar"?"solar_pm":"mep_pm";
  notify([pmRole,"sales","admin"],"⚠ PROJECT DELAYED — \""+p.name+"\" ("+p.div+(p.soNo?", SO-"+p.soNo:"")+"): "+late.length+" checklist point(s) past their target date, max delay "+worst+" day"+(worst>1?"s":"")+". Latest pending: "+late[0].text.slice(0,60));
 });
 save();
}
/* ---- payment helpers ---- */
function paySum(so){
 var tot=so.pay.reduce(function(a,b){return a+b.a},0);
 var rcv=0;
 so.pay.forEach(function(x,i){
  if(x.rcv){rcv+=x.a;return}
  var pr=DB.payments.find(function(p){return p.soNo===so.no&&p.mi===i});
  if(pr)rcv+=payRcvd(pr);
 });
 return {tot:tot,rcv:rcv,pen:tot-rcv,pct:tot?Math.round(rcv*100/tot):0};
}
function payRecord(soNo,mi){return DB.payments.find(function(x){return x.co===U.co&&x.soNo===soNo&&x.mi===mi})}
function mRaise(pid,mi){
 var p=DB.projects.find(function(x){return x.id===pid});
 var so=mine(DB.sos).find(function(s){return s.no===p.soNo});
 var m=so.pay[mi],pr=payRecord(so.no,mi);
 var bal=pr?payBal(pr):m.a;
 modal('<h3>Raise Payment Milestone to Finance</h3>'+
 '<div class="flowinfo"><b>'+esc(p.name)+'</b> · SO-'+so.no+'<br>Milestone '+(mi+1)+': '+esc(m.d)+'<br>Amount due: <b class="due">'+money(bal)+'</b></div>'+
 '<label>Site status / reason (goes to finance)</label><input id="rz_n" value="'+esc(p.stage)+' stage completed — milestone due">'+
 '<div class="grid2"><div><label>Requested collection by</label><input id="rz_d" type="date" value="'+addDays(today(),7)+'"></div>'+
 '<div><label>Priority</label><select id="rz_p"><option>Normal</option><option>Urgent</option></select></div></div>'+
 '<div class="mact"><button class="btn sec" onclick="closeModal()">Cancel</button><button class="btn grn" onclick="doRaise('+pid+','+mi+')">📤 Notify Finance</button></div>');
}
function doRaise(pid,mi){
 var p=DB.projects.find(function(x){return x.id===pid});
 var so=mine(DB.sos).find(function(s){return s.no===p.soNo});
 var m=so.pay[mi],pr=payRecord(so.no,mi);
 if(!pr){ // create the pending entry if missing
  DB.seq.pay++;

function savePM(id){

 var sel=document.getElementById("p_eng");var engs=[];for(var i=0;i<sel.options.length;i++)if(sel.options[i].selected)engs.push(sel.options[i].value);
 var newEngs=engs.filter(function(e){return p.engs.indexOf(e)<0});
 p.engs=engs;
 if(p.stage==="Completed"&&p.status!=="In Service"){
  var pend=(p.dc||[]).filter(function(x){return x.ret}).reduce(function(a,b){return a+((Number(b.qty)||0)-(Number(b.rqty)||0))},0);
  var notAppr=p.chk.filter(function(c){return !c.done||!(c.appr&&c.appr.by)}).length;

  if(notAppr>0&&!confirm(notAppr+" checklist point(s) are not completed/approved. Mark project completed anyway?")){p.stage=old;save();nav("project",id);return}
  p.status="Completed";p.end=p.end||today()}
 else if(p.status!=="In Service")p.status="Ongoing";
 if(old!==p.stage){
  notify(["finance"],"Project stage update: \""+p.name+"\" moved "+old+" → "+p.stage+(p.soNo?" (SO-"+p.soNo+"). Check payment milestone due as per SO terms.":"."));

  if(p.stage==="Completed")notify(["service_mgr"],"Project \""+p.name+"\" marked Completed. Approve commissioning to convert into 1-year warranty service project.");
 }
 if(newEngs.length)notify(["*"],"Engineer(s) "+newEngs.join(", ")+" assigned to project \""+p.name+"\"");

}

function autoFillTimeline(pid){

 }

  var img=new Image();
  img.onload=function(){
   var cv=document.createElement("canvas");var sc=Math.min(1,480/img.width);
   cv.width=img.width*sc;cv.height=img.height*sc;

function invItems(){return DB.invItems.filter(function(x){return x.co===U.co})}
function invCats(){return DB.invCats.filter(function(x){return x.co===U.co})}
function invLocs(){return DB.invLocs.filter(function(x){return x.co===U.co})}
function invIssues(){return DB.invIssues.filter(function(x){return x.co===U.co})}
function invTxns(){return DB.invTxns.filter(function(x){return x.co===U.co})}
function itemById(id){return DB.invItems.filter(function(x){return x.id===Number(id)})[0]}
function catName(id){var c=DB.invCats.filter(function(x){return x.id===Number(id)})[0];return c?c.name:"—"}
function locName(id){var l=DB.invLocs.filter(function(x){return x.id===Number(id)})[0];return l?l.name:"—"}
function totQty(it){var t=0;for(var k in (it.stock||{}))t+=Number(it.stock[k])||0;return t}
function issuedQty(it){ // qty currently lying with staff (tools + unused consumables)
 return invIssues().filter(function(x){return x.item===it.id}).reduce(function(a,b){return a+issBal(b)},0);
}
function stockState(it){
 var t=totQty(it);
 if(t<=0)return{txt:"Out of Stock",cls:"b-red",lvl:2};
 if(it.min&&t<=it.min)return{txt:"Low Stock",cls:"b-amb",lvl:1};
 return{txt:"In Stock",cls:"b-grn",lvl:0};
}
function stockValue(it){return totQty(it)*(Number(it.rate)||0)}
function canStock(){return U.role==="inventory"||U.role==="admin"}
function invLog(type,item,qty,from,to,ref,remark){
 DB.seq.invTxn=(DB.seq.invTxn||0)+1;
 DB.invTxns.push({id:DB.seq.invTxn,co:U.co,date:today(),type:type,item:item,qty:qty,from:from||"",to:to||"",by:U.name,ref:ref||"",remark:remark||""});
}
function moveStock(it,locId,delta){
 it.stock=it.stock||{};
 var k=String(locId);
 it.stock[k]=(Number(it.stock[k])||0)+delta;
 if(it.stock[k]<0)it.stock[k]=0;
}
function lowStockItems(){return invItems().filter(function(i){return stockState(i).lvl>0})}
function pendingReturns(){return invIssues().filter(function(x){return x.ret&&issBal(x)>0&&x.status!=="Returned"})}
function issBal(x){return Math.max(0,(Number(x.qty)||0)-(Number(x.rqty)||0)-(Number(x.used)||0))}
function returnableNow(){ // anything still lying with staff — returnable tools AND unused consumables
 return invIssues().filter(function(x){return issBal(x)>0&&x.status!=="Returned"});
}
function reqReturns(){return invIssues().filter(function(x){return x.retReq&&issBal(x)>0})}
function issStatus(x){
 if(issBal(x)<=0)return (Number(x.rqty)||0)>0?(Number(x.used)||0>0?"Returned / Used":"Returned"):"Consumed";
 if((Number(x.rqty)||0)>0)return "Partially Returned";
 if(x.retReq)return "Return Requested";
 return "Issued";
}
function issCls(st){return st==="Returned"?"b-grn":st==="Returned / Used"?"b-grn":st==="Consumed"?"b-gry":st==="Partially Returned"?"b-blu":st==="Return Requested"?"b-prp":"b-amb"}

function rtTypeChg(bal){

}
function saveInvReturn(id){
 var x=DB.invIssues.filter(function(i){return i.id===id})[0];var it=itemById(x.item);
 var q=Number(gv("rt_q2"))||0,loc=Number(gv("rt_l"));
 var bal=issBal(x);
 if(q<=0||q>bal){toast("Enter a quantity between 1 and "+bal);return}
 var damaged=gv("rt_cond").indexOf("Damaged")===0;
 x.rqty=(Number(x.rqty)||0)+q;
 if(!damaged)moveStock(it,loc,q);
 invLog("Return",it.id,q,"",damaged?"":loc,x.staff,(damaged?"DAMAGED — not added to stock. ":"")+(gv("rt_r2")||""));
 if(damaged)invLog("Damage / Write-off",it.id,q,"","",x.staff,"damaged material returned");
 var cb=document.getElementById("rt_bal");
 if(cb&&cb.checked&&issBal(x)>0){
  var rest=issBal(x);x.used=(Number(x.used)||0)+rest;
  invLog("Consumed",it.id,rest,"","",x.staff+" / "+x.site,"balance marked used on site");
 }
 x.retReq=false;x.retReqQty=0;
 x.status=issStatus(x);
 notify(["*"],"Material returned by "+x.staff+": "+q+" "+it.unit+" "+it.name+(issBal(x)>0?" — "+issBal(x)+" "+it.unit+" still pending":" — issue closed"));
 save();closeModal();
 nav(VIEW==="dash"?"dash":(VIEW==="mymaterial"?"mymaterial":(VIEW==="invissue"?"invissue":"invreturn")));
 toast(q+" "+it.unit+(damaged?" written off (damaged)":" received into "+locName(loc))+(issBal(x)>0?" · "+issBal(x)+" pending":" · issue closed"));
}
function markConsumed(id){
 var x=DB.invIssues.filter(function(i){return i.id===id})[0];
 var bal=issBal(x);
 if(bal>0){x.used=(Number(x.used)||0)+bal;
  var it=itemById(x.item);
  invLog("Consumed",it.id,bal,"","",x.staff+" / "+x.site,"used on site");}
 x.status=issStatus(x);
 save();nav(VIEW);toast("Marked as used on site");
}

/* signature pad */
var _sg=null;
function initSig(){
 var cv=document.getElementById("sig");if(!cv)return;
 cv.width=cv.offsetWidth;cv.height=140;
 var ctx=cv.getContext("2d");ctx.lineWidth=2;ctx.lineCap="round";ctx.strokeStyle="#16202e";
 _sg={cv:cv,ctx:ctx,drawing:false,empty:true};
 function pos(e){var r=cv.getBoundingClientRect();var t=e.touches?e.touches[0]:e;return[t.clientX-r.left,t.clientY-r.top]}
 function st(e){e.preventDefault();_sg.drawing=true;var p=pos(e);ctx.beginPath();ctx.moveTo(p[0],p[1])}
 function mv(e){if(!_sg.drawing)return;e.preventDefault();var p=pos(e);ctx.lineTo(p[0],p[1]);ctx.stroke();_sg.empty=false}
 function en(){_sg.drawing=false}
 cv.addEventListener("mousedown",st);cv.addEventListener("mousemove",mv);window.addEventListener("mouseup",en);
 cv.addEventListener("touchstart",st,{passive:false});cv.addEventListener("touchmove",mv,{passive:false});cv.addEventListener("touchend",en);
}
function clearSig(){if(_sg){_sg.ctx.clearRect(0,0,_sg.cv.width,_sg.cv.height);_sg.empty=true}}
function saveReport(id,complete){
 var s=DB.svcCalls.find(function(x){return x.id===id});
 var chk={};SVC_CHK.forEach(function(k,i){chk[k]=gv("r_c"+i)});
 s.report={make:gv("r_make"),model:gv("r_model"),capacity:gv("r_cap"),rtype:gv("r_type"),material:gv("r_mat"),service:gv("r_svc"),chk:chk,stype:gv("r_st"),amount:Number(gv("r_amt"))||0,remark:gv("r_rem"),custRemark:gv("r_crem")};
 if(complete){
  if(_sg&&_sg.empty){toast("Client signature required to complete the call");return}
  s.sig=_sg?_sg.cv.toDataURL("image/png"):"";
  s.status="Completed";
  if(s.contractId){ // mark PM service done on contract
   var c=DB.contracts.find(function(x){return x.id===s.contractId});
   if(c){var due=pmDue(c);if(due.length)c.svcs[due[0]].done=today()}
  }
  if(s.report.stype==="Chargeable"&&s.report.amount>0){
   DB.seq.pay++;DB.payments.push({id:DB.seq.pay,co:U.co,project:s.site+" (PSC-"+s.psc+")",person:s.customer,phone:s.phone,amount:s.report.amount,remark:"Chargeable service call",lastCall:"",disc:"",nextCall:"",status:"Pending",soNo:""});
   notify(["finance"],"Chargeable service PSC-"+s.psc+" completed — "+money(s.report.amount)+" to collect from "+s.customer);
  }
  notify(["service_mgr","admin"],"PSC-"+s.psc+" completed by "+(s.eng||U.name)+" — "+s.customer);
  save();nav("call",id);
  showMsg("Completion message — PSC "+s.psc,s.type==="PM"?msgPMdone(s.psc,s.date,s.time):msgDone(s.psc),s.phone);
 } else {save();nav("call",id);toast("Report draft saved")}
}

  notify(["admin","sales"],"Payment fully received: "+money(x.amount)+" — "+x.project+(x.soNo?" (SO-"+x.soNo+")":""));

function syncPayStatus(x){
 var bal=payBal(x);
 if(bal<=0){
  x.status="Received";
  x.rcvDate=(x.paid&&x.paid.length)?x.paid[x.paid.length-1].date:today();
  if(x.soNo){var so=mine(DB.sos).find(function(s){return s.no===x.soNo});if(so&&so.pay[x.mi])so.pay[x.mi].rcv=true}
 }else{
  x.status="Pending";x.rcvDate="";
  if(x.soNo){var so2=mine(DB.sos).find(function(s){return s.no===x.soNo});if(so2&&so2.pay[x.mi])so2.pay[x.mi].rcv=false}
 }
}

function vPayments(){
 var all=mine(DB.payments);

 var totRcv=all.reduce(function(a,b){return a+payRcvd(b)},0);
 var h='<div class="cards">'+kpi(money(totBilled),"Total Billed","b")+kpi(money(totRcv),"Total Collected","g")+kpi(money(totBilled-totRcv),"Outstanding","r")+kpi(pend.filter(function(x){return payRcvd(x)>0}).length,"Part-paid Milestones","a")+kpi(pend.filter(function(x){return x.raised}).length,"Raised by PM","r")+'</div>';
 h+='<div class="panel" style="padding:10px 12px;margin-bottom:10px"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><b style="font-size:13px">Reports:</b>'+
 '<button class="btn sm sec" onclick="dlPayments()">⬇ Pending & Received Payments</button>'+
 '<button class="btn sm sec" onclick="dlReceipts()">⬇ Receipts Ledger</button></div></div>';
 h+=srchBar("Search project, person, phone, SO no, remark...",pend.length,mine(DB.payments).filter(function(x){return x.status==="Pending"}).length);
 h+=payPanel();
 // all receipts ledger
 var receipts=[];
 all.forEach(function(x){(x.paid||[]).forEach(function(p){receipts.push({x:x,p:p})})});
 receipts.sort(function(a,b){return a.p.date<b.p.date?1:-1});
 h+='<div class="panel"><div class="phead"><h2>🧾 Payment Receipts Ledger</h2><span class="bdg b-grn">'+receipts.length+' receipts · '+money(totRcv)+'</span><button class="btn sm sec" onclick="dlReceipts()">⬇ Export</button></div>';
 if(!receipts.length)h+='<div class="subtle">No payments recorded yet.</div>';
 else{
  h+='<div class="tw"><table style="min-width:1000px"><tr><th>Date</th><th>Project</th><th>Person</th><th>Amount</th><th>Mode</th><th>Reference</th><th>Invoice</th><th>Milestone Status</th><th>Entered By</th><th></th></tr>';
  receipts.forEach(function(r){
   var idx=(r.x.paid||[]).indexOf(r.p);
   h+='<tr><td>'+esc(r.p.date)+'</td><td><b>'+esc(r.x.project)+'</b>'+(r.x.soNo?'<div class="subtle">SO-'+r.x.soNo+'</div>':"")+'</td><td>'+esc(r.x.person)+'</td><td><b>'+money(r.p.amt)+'</b></td><td>'+esc(r.p.mode||"-")+'</td><td>'+esc(r.p.ref||"-")+'</td><td>'+(r.p.inv?"✔":"—")+'</td><td>'+(r.x.status==="Received"?bdg("Settled","b-grn"):bdg("Part · bal "+money(payBal(r.x)),"b-amb"))+'</td><td>'+esc(r.p.by||"-")+(r.p.editedBy?'<div class="subtle">edited by '+esc(r.p.editedBy)+' '+esc(r.p.editedOn)+'</div>':"")+'</td><td><button class="btn sm sec" onclick="mEditPayment('+r.x.id+','+idx+')">Edit</button></td></tr>'});
  h+='</table></div>';
 }
 h+='</div>';
 var done=all.filter(function(x){return x.status==="Received"});
 if(done.length){
  h+='<div class="panel"><h2>✔ Fully Settled Milestones</h2><div class="tw"><table><tr><th>Project</th><th>Person</th><th>Amount</th><th>Parts</th><th>Settled On</th><th></th></tr>';
  done.slice().reverse().forEach(function(x){h+='<tr><td>'+esc(x.project)+'</td><td>'+esc(x.person)+'</td><td>'+money(x.amount)+'</td><td>'+((x.paid||[]).length||1)+'</td><td>'+esc(x.rcvDate||"-")+'</td><td style="white-space:nowrap"><button class="btn sm sec" onclick="mPayEdit('+x.id+')">Edit</button>'+((x.paid||[]).length?' <button class="btn sm sec" onclick="mPayHistory('+x.id+')">History</button>':"")+'</td></tr>'});
  h+='</table></div></div>';
 }
 h+='<div class="panel"><div class="phead"><h2>Add Manual Pending Entry</h2><button class="btn sm" onclick="mPayNew()">+ Add</button></div><div class="subtle">SO-linked milestones are added automatically when Sales creates an SO. Use this only for other receivables.</div></div>';
 return h;
}

var DEFERRED_PROMPT=null;
function pwaShowInstall(on){
 var b=document.getElementById("instbar"),l=document.getElementById("loginInstall");
 if(b)b.classList.toggle("on",!!on&&!!U);
 if(l)l.style.display=(on&&!U)?"block":"none";
}
window.addEventListener("beforeinstallprompt",function(e){
 e.preventDefault();DEFERRED_PROMPT=e;pwaShowInstall(true);
});
function pwaInstall(){
 if(!DEFERRED_PROMPT){
  toast("Use your browser menu → \"Install app\" / \"Add to Home screen\"");
  return;
 }
 DEFERRED_PROMPT.prompt();
 DEFERRED_PROMPT.userChoice.then(function(c){
  if(c&&c.outcome==="accepted")toast("Installing MEP PROJECTS…");
  DEFERRED_PROMPT=null;pwaShowInstall(false);
 });
}
window.addEventListener("appinstalled",function(){DEFERRED_PROMPT=null;pwaShowInstall(false);toast("App installed")});
function pwaOffline(){
 var b=document.getElementById("offbar");
 if(b)b.classList.toggle("on",!navigator.onLine);
}
window.addEventListener("online",function(){pwaOffline();toast("Back online")});
window.addEventListener("offline",pwaOffline);
function pwaRegister(){
 if(!("serviceWorker" in navigator))return;
 if(location.protocol==="file:")return;   // service workers need http(s) — see README
 navigator.serviceWorker.register("sw.js").then(function(reg){
  reg.addEventListener("updatefound",function(){
   var nw=reg.installing;if(!nw)return;
   nw.addEventListener("statechange",function(){
    if(nw.state==="installed"&&navigator.serviceWorker.controller){
     modal('<h3>Update available</h3><div class="flowinfo">A newer version of MEP PROJECTS has been downloaded. Your saved data is not affected.</div>'+
      '<div class="mact"><button class="btn sec" onclick="closeModal()">Later</button><button class="btn" onclick="pwaUpdate()">Reload now</button></div>');
     window.__NEW_SW=nw;
    }
   });
  });
 }).catch(function(){});
}
function pwaUpdate(){
 if(window.__NEW_SW)window.__NEW_SW.postMessage("SKIP_WAITING");
 closeModal();setTimeout(function(){location.reload()},300);
}
function isStandalone(){
 return window.matchMedia("(display-mode: standalone)").matches||window.navigator.standalone===true;
}

load();renderQuick();pwaRegister();pwaOffline();
if(!isStandalone()&&DEFERRED_PROMPT)pwaShowInstall(true);
